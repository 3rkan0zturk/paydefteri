<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#14213b;background:#f2f5fa;font-size:16px;--blue:#1649db;--muted:#61708b;--line:#dce3ee}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:#263854;border-radius:9px;padding:10px 15px;font-weight:600}button:hover{background:#edf2ff;border-color:#96aff6}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e5a919;outline-offset:2px}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:#b32637}button.small{padding:6px 10px;font-size:.875rem}button:disabled{opacity:.45;cursor:not-allowed}header{background:#10213f;color:#fff;padding:24px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:1.5rem;margin:0;letter-spacing:-.6px}.brand{display:flex;gap:13px;align-items:center}.mark{display:grid;place-items:center;background:#3a68fb;width:43px;height:43px;border-radius:12px;font-size:1.6rem}.sub{font-size:.875rem;color:#b9c7e0;margin-top:3px}.local{font-size:.875rem;color:#cbd7ec}main{max-width:1240px;margin:0 auto;padding:28px 24px 60px}.periodbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.periodcontrol{display:flex;align-items:center;gap:8px}.periodtitle{font-size:1.25rem;font-weight:700;margin-bottom:5px}.muted{color:var(--muted);font-size:.9rem;line-height:1.55}input,select{width:100%;padding:10px 11px;background:#fff;color:#14213b;border:1px solid #bfcbdc;border-radius:8px;min-height:43px}input[type=checkbox]{width:19px;min-height:19px;accent-color:var(--blue)}input[type=month]{width:175px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.stat:first-child{background:var(--blue);border-color:var(--blue);color:white}.stat .label{font-size:.9rem;color:var(--muted)}.stat:first-child .label,.stat:first-child .hint{color:#d6e1ff}.value{font-size:1.75rem;font-weight:700;letter-spacing:-.7px;margin:10px 0 4px;overflow-wrap:anywhere}.hint{font-size:.875rem;color:var(--muted)}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:13px}nav button{background:transparent;border-color:transparent}nav button[aria-selected=true]{background:#e1e9ff;color:#1649db;border-color:#bccfff}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}.panelhead{padding:21px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:1.15rem}h3{font-size:1rem;margin:0 0 15px}.content{padding:22px}.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}label.field{display:block;margin-bottom:15px;font-size:.9rem;font-weight:600}label.field input,label.field select{display:block;margin-top:7px;font-weight:400}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.stack{display:grid;gap:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:.925rem}th{padding:13px 18px;background:#f8faff;color:#60708b;font-weight:600;font-size:.85rem;white-space:nowrap}td{padding:16px 18px;border-top:1px solid #e7ecf4}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.badge{display:inline-block;font-size:.83rem;border-radius:6px;padding:5px 8px;white-space:nowrap}.bad{background:#fff0f1;color:#a32236}.warn{background:#fff6df;color:#805710}.good{background:#e8f7f1;color:#086b4a}.neutral{background:#edf1f6;color:#59687f}.empty{text-align:center;padding:48px 22px;color:var(--muted);line-height:1.7}.empty strong{display:block;color:#283b5d;margin-bottom:6px}.note{border-radius:10px;background:#eef3ff;color:#31548e;padding:13px 16px;font-size:.9rem;line-height:1.6;margin-bottom:18px}.peoplegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:18px 0}.personcheck{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:13px;overflow-wrap:anywhere}.personcheck:has(input:checked){background:#f0f5ff;border-color:#a5bdfb}.listitem{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem:last-child{border:0}.listitem strong{overflow-wrap:anywhere}.error{color:#a32236;background:#fff0f1;padding:14px;border-radius:9px;margin:0 0 18px}.status{font-size:.875rem;color:#62718c;margin-top:25px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10213f;color:white;padding:14px 22px;border-radius:12px;box-shadow:0 7px 30px #10213f30;max-width:90vw;z-index:9}.actions{display:flex;gap:7px;white-space:nowrap}dialog{max-width:540px;width:calc(100% - 32px);border:0;border-radius:15px;padding:25px;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#10213f88}dialog p{line-height:1.6;white-space:pre-line}footer{margin-top:26px}a{color:var(--blue)}[hidden]{display:none!important}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.periodbar{align-items:flex-start;flex-direction:column}.value{font-size:1.5rem}}@media(max-width:540px){header{padding:18px}.local{display:none}main{padding:22px 14px}.stats{gap:10px}.stat{padding:15px}.panelhead{padding:17px;align-items:flex-start;flex-direction:column}.content{padding:17px}nav{gap:2px}nav button{padding:9px 10px;font-size:.9rem}.value{font-size:1.3rem}.periodcontrol{flex-wrap:wrap}}

<body>
<header><div class="brand"><div class="mark" aria-hidden="true">▤</div><div><h1>Pay Defteri</h1><div class="sub">Malzeme, harcama ve ödeme takibi</div></div></div><button id="installApp" class="small">Telefona yükle</button></header>
<div id="offlineReady" class="muted" style="max-width:1240px;margin:10px auto 0;padding:0 24px" role="status">Veriler bu cihazda saklanır.</div>
<main><div id="fatal" class="error" role="alert" hidden></div><section class="periodbar"><div><div class="periodtitle" id="periodTitle"></div><div class="muted">Her dönem ayın 15’inde başlar, sonraki ayın 14’ü sonunda biter.</div></div><div class="periodcontrol"><button id="prev" aria-label="Önceki dönem">‹</button><input type="month" id="period" aria-label="Dönem başlangıç ayı" min="1900-01" max="9998-12"><button id="next" aria-label="Sonraki dönem">›</button><button id="today">Bu dönem</button></div></section>
<section class="stats" id="stats" aria-label="Dönem özeti"></section>
<nav role="tablist" aria-label="Bölümler"><button role="tab" data-tab="summary">Dönem özeti</button><button role="tab" data-tab="expenses">Harcamalar</button><button role="tab" data-tab="payments">Ödemeler</button><button role="tab" data-tab="people">Kişiler</button><button role="tab" data-tab="materials">Malzemeler</button><button role="tab" data-tab="backup">Yedek ve aktarım</button></nav>
<div id="view" role="tabpanel"></div><footer class="status" id="saveStatus"></footer></main>
<div id="toast" class="toast" role="status" hidden></div><dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="row" style="justify-content:flex-end"><button id="confirmNo">Vazgeç</button><button id="confirmYes" class="primary">Onayla</button></div></dialog>
<script>
'use strict';
const KEY='pay-defteri-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n/100);
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
function periodOf(date){let [y,m,d]=date.split('-').map(Number);if(d<15){m--;if(!m){m=12;y--;}}return `${y}-${String(m).padStart(2,'0')}`;}
function movePeriod(p,delta){let [y,m]=p.split('-').map(Number);const d=new Date(y,m-1+delta,15);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
const validPeriod=p=>typeof p==='string'&&/^\d{4}-\d{2}$/.test(p)&&+p.slice(0,4)>=1900&&+p.slice(0,4)<=9998&&+p.slice(5)>=1&&+p.slice(5)<=12;
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&iso(d)===s&&+s.slice(0,4)>=1900&&+s.slice(0,4)<=9998;}
function cents(s){s=String(s).trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(s))throw Error('Tutarı 1250,50 biçiminde, en fazla iki ondalıkla girin.');const n=Math.round(Number(s)*100);if(!Number.isSafeInteger(n)||n<=0||n>100000000000)throw Error('Tutar 0’dan büyük, en fazla 1 milyar TL olmalıdır.');return n;}
const blank=()=>({version:1,people:[],materials:[],expenses:[],payments:[],periods:{},updatedAt:null});
function validate(d){
 if(!d||d.version!==1||!Array.isArray(d.people)||!Array.isArray(d.materials)||!Array.isArray(d.expenses)||!Array.isArray(d.payments)||!d.periods||typeof d.periods!=='object'||Array.isArray(d.periods))throw Error('Bu dosya geçerli bir Pay Defteri yedeği değil.');
 const all=new Set();const ident=x=>{if(typeof x!=='string'||!x||x.length>100)throw Error('Geçersiz kayıt kimliği.');};
 for(const arr of [d.people,d.materials,d.expenses,d.payments])for(const x of arr){if(!x||typeof x!=='object')throw Error('Geçersiz kayıt.');ident(x.id);if(all.has(x.id))throw Error('Tekrarlanan kayıt kimliği.');all.add(x.id);}
 for(const arr of [d.people,d.materials])for(const x of arr)if(typeof x.name!=='string'||!x.name.trim()||x.name.length>120||typeof x.archived!=='boolean')throw Error('Geçersiz kişi veya malzeme kaydı.');
 const ps=new Set(d.people.map(x=>x.id)),ms=new Set(d.materials.map(x=>x.id));
 for(const [p,v] of Object.entries(d.periods)){if(!validPeriod(p)||!Array.isArray(v)||new Set(v).size!==v.length||v.some(x=>!ps.has(x)))throw Error('Geçersiz dönem katılımcıları.');}
 for(const [arr,kind] of [[d.expenses,'expense'],[d.payments,'payment']])for(const x of arr){if(!validDate(x.date)||!Number.isSafeInteger(x.amount)||x.amount<=0||x.amount>100000000000||typeof x.note!=='string'||x.note.length>500)throw Error('Geçersiz tarih, tutar veya açıklama.');if(kind==='expense'&&!ms.has(x.materialId))throw Error('Harcamanın malzemesi bulunamadı.');if(kind==='payment'&&(!ps.has(x.personId)||!validPeriod(x.period)||!d.periods[x.period]?.includes(x.personId)))throw Error('Ödemenin kişisi veya dönemi geçersiz.');}
 if(d.expenses.reduce((n,x)=>n+x.amount,0)>Number.MAX_SAFE_INTEGER||d.payments.reduce((n,x)=>n+x.amount,0)>Number.MAX_SAFE_INTEGER)throw Error('Toplam tutar sınırı aşıldı.');
 return d;
}
function calculate(d,p){const expenses=d.expenses.filter(x=>periodOf(x.date)===p),payments=d.payments.filter(x=>x.period===p),members=d.periods[p]||[],total=expenses.reduce((n,x)=>n+x.amount,0),paid=payments.reduce((n,x)=>n+x.amount,0);const base=members.length?Math.floor(total/members.length):0,rem=members.length?total%members.length:0;const rows=members.map((pid,i)=>{const due=base+(i<rem?1:0),paid=payments.filter(x=>x.personId===pid).reduce((n,x)=>n+x.amount,0);return {id:pid,due,paid,remaining:Math.max(0,due-paid),excess:Math.max(0,paid-due)};});return {expenses,payments,members,total,paid,base,rem,rows,remaining:rows.reduce((n,x)=>n+x.remaining,0),excess:rows.reduce((n,x)=>n+x.excess,0)};}
let db=blank(),lastRaw=null,blocked=false,active='summary',period=periodOf(today()),editId=null,onlyOwing=false;
try{lastRaw=localStorage.getItem(KEY);if(lastRaw)db=validate(JSON.parse(lastRaw));}catch(e){blocked=true;$('#fatal').hidden=false;$('#fatal').textContent='Kayıtlar okunamadı. Veri kaybını önlemek için kayıt işlemi durduruldu. Yedek ve aktarım bölümünden mevcut ham veriyi indirin veya geçerli bir yedeği yükleyin. '+e.message;}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4500);}
function fail(e){toast(e.message||String(e));}
function commit(fn,{recover=false}={}){if(blocked&&!recover)throw Error('Kayıt kapalı. Önce geçerli bir yedek yükleyin.');if(localStorage.getItem(KEY)!==lastRaw)throw Error('Başka bir sekmede değişiklik var. Sayfayı yenileyip tekrar deneyin.');const next=structuredClone(db);fn(next);validate(next);next.updatedAt=new Date().toISOString();const raw=JSON.stringify(next);try{localStorage.setItem(KEY,raw);}catch(e){throw Error('Tarayıcı veriyi kaydedemedi. Depolama alanını kontrol edin ve yedek alın.');}db=next;lastRaw=raw;blocked=false;$('#fatal').hidden=true;render();}
function ask(title,text){return new Promise(resolve=>{const dlg=$('#confirmDialog');$('#confirmTitle').textContent=title;$('#confirmText').textContent=text;const done=v=>{dlg.close();resolve(v);};$('#confirmYes').onclick=()=>done(true);$('#confirmNo').onclick=()=>done(false);dlg.oncancel=e=>{e.preventDefault();done(false);};dlg.showModal();});}
const nameOf=(arr,pid)=>arr.find(x=>x.id===pid)?.name||'Bilinmeyen';
const dateText=s=>new Date(s+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
const options=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}${x.archived?' (arşiv)':''}</option>`).join('');
const empty=(title,text)=>`<div class="empty"><strong>${title}</strong>${text}</div>`;
function defaultDate(){return periodOf(today())===period?today():period+'-15';}
function setPeriod(p){if(!validPeriod(p))return toast('Geçerli bir dönem seçin.');period=p;editId=null;render();}
function render(){
 $('#period').value=period;$('#periodTitle').textContent=dateText(period+'-15')+' – '+dateText(movePeriod(period,1)+'-14');
 const c=calculate(db,period);$('#stats').innerHTML=[['Toplam harcama',money(c.total),`${c.expenses.length} malzeme alımı`],['Toplanan ödeme',money(c.paid),`${c.payments.length} ödeme kaydı`],['Kalan ödeme',money(c.remaining),c.members.length?`${c.rows.filter(x=>x.remaining>0).length} kişinin ödemesi eksik`:'Önce dönem kişilerini seçin'],['Kişi başına',c.members.length?(money(c.base)+(c.rem?' – '+money(c.base+1):'')):'—',`${c.members.length} kişi bu döneme katılıyor`]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===active?'true':'false'));
 $('#view').innerHTML=active==='summary'?summary(c):active==='expenses'?expenses(c):active==='payments'?payments(c):active==='backup'?backup():registry(active);
 $('#saveStatus').textContent=db.updatedAt?'Son kayıt: '+new Date(db.updatedAt).toLocaleString('tr-TR')+' · Otomatik kayıt açık':'Henüz kayıt yok · Değişiklikler otomatik kaydedilir';
 bind(c);
}
function summary(c){const rows=c.rows.filter(x=>!onlyOwing||x.remaining>0);return `<div class="panel"><div class="panelhead"><div><h2>Kim, ne kadar ödeyecek?</h2><div class="muted">Yalnızca bu döneme seçilen kişiler sorumludur.</div></div><label class="row"><input type="checkbox" id="onlyOwing" ${onlyOwing?'checked':''}> Sadece eksik ödemeler</label></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Kişi</th><th class="num">Dönem payı</th><th class="num">Ödenen</th><th class="num">Kalan</th><th>Durum</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(nameOf(db.people,x.id))}</strong></td><td class="num">${money(x.due)}</td><td class="num">${money(x.paid)}</td><td class="num">${money(x.remaining)}</td><td>${x.excess?`<span class="badge good">${money(x.excess)} fazla ödeme</span>`:x.remaining?`<span class="badge ${x.paid?'warn':'bad'}">${x.paid?'Kısmi ödeme':'Ödenmedi'}</span>`:`<span class="badge ${x.due?'good':'neutral'}">${x.due?'Tamamlandı':'Borç yok'}</span>`}</td><td>${x.remaining?`<button class="small" data-pay="${esc(x.id)}">Ödeme ekle</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty(c.members.length?'Eksik ödeme bulunmuyor':'Bu dönemin kişilerini seçin',c.members.length?'Seçtiğiniz görünümde listelenecek kişi yok.':'Aşağıdan ücret paylaşımına katılacak kişileri işaretleyin.')}</div><div class="panel"><div class="panelhead"><div><h2>Döneme katılan kişiler</h2><div class="muted">Seçiminiz yalnızca bu dönemi etkiler; yeni dönemler boş başlar.</div></div><button class="small" id="selectAll">Aktif kişileri seç</button></div><form id="membersForm" class="content">${db.people.length?`<div class="note">Dönemin toplam harcaması seçilen kişilere eşit bölünür. Kuruş farkları seçim sırasına göre dağıtılır. Katılımcıları değiştirmek bu dönemin paylarını yeniden hesaplar.</div><div class="peoplegrid">${db.people.filter(x=>!x.archived||c.members.includes(x.id)).map(x=>`<label class="personcheck"><input type="checkbox" name="member" value="${esc(x.id)}" ${c.members.includes(x.id)?'checked':''}><span>${esc(x.name)}${x.archived?' (arşiv)':''}</span></label>`).join('')}</div><button class="primary">Dönem kişilerini kaydet</button>`:empty('Önce kişi ekleyin','Kişiler sekmesinden adları kaydedip buraya dönebilirsiniz.')}</form></div>${c.excess?`<div class="note">Toplam ${money(c.excess)} fazla ödeme var. Fazla ödeme diğer kişilerin borcundan düşülmez ve sonraki döneme otomatik taşınmaz.</div>`:''}`;}
function entryForm(kind,c){const isExp=kind==='expenses',record=db[kind].find(x=>x.id===editId),list=isExp?db.materials.filter(x=>!x.archived||record?.materialId===x.id):db.people.filter(x=>c.members.includes(x.id));return `<div class="panel"><div class="panelhead"><h2>${record?'Kaydı düzenle':isExp?'Harcama ekle':'Ödeme ekle'}</h2></div><form class="content" id="entryForm"><label class="field">${isExp?'Malzeme':'Kişi'}<select name="entity" required><option value="">${isExp?'Malzeme seçin':'Kişi seçin'}</option>${options(list,record?.[isExp?'materialId':'personId'])}</select></label>${!list.length?`<p class="muted">${isExp?'Önce Malzemeler sekmesinden malzeme kaydedin.':'Önce Dönem özeti bölümünden katılımcıları seçip kaydedin.'}</p>`:''}<label class="field">${isExp?'Alım tarihi':'Ödeme tarihi'}<input type="date" name="date" required min="1900-01-01" max="9998-12-31" value="${record?.date||defaultDate()}"></label><label class="field">${isExp?'Toplam fiyat (TL)':'Ödenen tutar (TL)'}<input name="amount" inputmode="decimal" autocomplete="off" placeholder="Örn. 1250,50" required value="${record?(record.amount/100).toFixed(2).replace('.',','):''}"></label><label class="field">Açıklama <span class="muted">(isteğe bağlı)</span><input name="note" maxlength="500" value="${esc(record?.note||'')}" placeholder="${isExp?'Miktar, fiş veya kısa not':'Ödeme ile ilgili kısa not'}"></label><div class="note">${isExp?'Harcama, alım tarihinin ait olduğu döneme eklenir.':'Ödeme, tarihi farklı olsa da yukarıda seçili dönemin borcuna işlenir.'}</div><div class="row"><button class="primary" ${!list.length?'disabled':''}>${record?'Değişiklikleri kaydet':'Kaydet'}</button>${record?'<button type="button" id="cancelEdit">Vazgeç</button>':''}</div></form></div>`;}
function expenses(c){return `<div class="split">${entryForm('expenses',c)}<div class="panel"><div class="panelhead"><h2>Malzeme alımları</h2><strong>${money(c.total)}</strong></div>${c.expenses.length?entryTable(c.expenses,true):empty('Bu dönemde harcama yok','Bir malzeme seçin, alım tarihini ve toplam fiyatını girin.')}</div></div>`;}
function payments(c){return `<div class="split">${entryForm('payments',c)}<div class="panel"><div class="panelhead"><h2>Alınan ödemeler</h2><strong>${money(c.paid)}</strong></div>${c.payments.length?entryTable(c.payments,false):empty('Bu dönemde ödeme yok','Katılımcı seçip alınan tutarı kaydedin. Bir kişi için birden fazla ödeme ekleyebilirsiniz.')}</div></div>`;}
function entryTable(arr,isExp){return `<div class="tablewrap"><table><thead><tr><th>Tarih / ${isExp?'Malzeme':'Kişi'}</th><th class="num">Tutar</th><th>İşlem</th></tr></thead><tbody>${[...arr].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td><div class="muted">${dateText(x.date)}</div><strong>${esc(nameOf(isExp?db.materials:db.people,isExp?x.materialId:x.personId))}</strong>${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</td><td class="num">${money(x.amount)}</td><td><div class="actions"><button class="small" data-edit="${esc(x.id)}">Düzenle</button><button class="small danger" data-delete="${esc(x.id)}">Sil</button></div></td></tr>`).join('')}</tbody></table></div>`;}
function registry(kind){const isPeople=kind==='people',list=db[kind],record=list.find(x=>x.id===editId);return `<div class="split"><div class="panel"><div class="panelhead"><h2>${record?'Adı düzenle':isPeople?'Kişi ekle':'Malzeme ekle'}</h2></div><form class="content" id="registryForm"><label class="field">${isPeople?'Ad soyad':'Malzeme adı'}<input name="name" maxlength="120" required value="${esc(record?.name||'')}" placeholder="${isPeople?'Örn. Ayşe Yılmaz':'Örn. Çay, şeker, temizlik malzemesi'}"></label><div class="row"><button class="primary">${record?'Kaydet':'Ekle'}</button>${record?'<button type="button" id="cancelEdit">Vazgeç</button>':''}</div></form></div><div class="panel"><div class="panelhead"><h2>${isPeople?'Kayıtlı kişiler':'Kayıtlı malzemeler'}</h2><span class="muted">${list.filter(x=>!x.archived).length} aktif kayıt</span></div><div class="content"><div class="muted">Arşivlenen kayıtların geçmiş harcama ve ödemeleri korunur.</div>${list.length?list.map(x=>`<div class="listitem"><div><strong>${esc(x.name)}</strong>${x.archived?' <span class="badge neutral">Arşivde</span>':''}</div><div class="actions"><button class="small" data-edit="${esc(x.id)}">Düzenle</button><button class="small" data-archive="${esc(x.id)}">${x.archived?'Aktifleştir':'Arşivle'}</button></div></div>`).join(''):empty(isPeople?'Henüz kişi yok':'Henüz malzeme yok','İlk kaydı soldaki formdan ekleyin.')}</div></div></div>`;}
function backup(){return `<div class="split"><div class="panel"><div class="panelhead"><h2>Verileriniz sizde</h2></div><div class="content"><p class="muted" style="margin-top:0">Kayıtlar bu tarayıcının yerel belleğinde saklanır. İnternet bağlantısı gerekmez. Tarayıcı verileri silinirse veya farklı tarayıcı kullanırsanız kayıtlar görünmez.</p><div class="note">Düzenli olarak tam yedek indirin. Başka bilgisayara geçerken bu HTML dosyasını ve JSON yedeğini birlikte taşıyın.</div><div class="muted">${db.people.length} kişi · ${db.materials.length} malzeme<br>${db.expenses.length} harcama · ${db.payments.length} ödeme</div></div></div><div class="stack"><div class="panel"><div class="panelhead"><h2>Dışa aktar</h2></div><div class="content stack"><div><button class="primary" id="exportJson">Tam yedeği indir (JSON)</button><p class="muted">Bütün dönemler, kişiler, malzemeler, harcamalar ve ödemeler. İçe aktarma için bu dosyayı kullanın.</p></div><div><button id="exportCsv">Seçili dönem raporu (CSV)</button><p class="muted">Excel’de açılabilen kişi payları, harcama ve ödeme listesi.</p></div>${blocked?'<button id="exportRaw">Okunamayan mevcut veriyi indir</button>':''}</div></div><div class="panel"><div class="panelhead"><h2>Yedekten geri yükle</h2></div><div class="content"><label class="field">Pay Defteri yedeği (.json)<input type="file" id="importFile" accept=".json,application/json"></label><p class="muted">Yedek önce denetlenir. Onayınızla mevcut kayıtların tamamı değiştirilir; birleştirme yapılmaz. Değişim öncesinde mevcut verinizin yedeği otomatik indirilir.</p></div></div></div></div>`;}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportJson(){if(blocked)throw Error('Mevcut kayıtlar okunamadı. Ham veri indirme düğmesini kullanın.');download('Pay-Defteri-Yedek-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Tam yedek indirildi.');}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(c){const rows=[['PAY DEFTERİ',period+'-15',movePeriod(period,1)+'-14'],[],['KİŞİ PAYLARI'],['Kişi','Dönem payı (TL)','Ödenen (TL)','Kalan (TL)','Fazla ödeme (TL)'],...c.rows.map(x=>[nameOf(db.people,x.id),tl(x.due),tl(x.paid),tl(x.remaining),tl(x.excess)]),[],['HARCAMALAR'],['Tarih','Malzeme','Toplam fiyat (TL)','Açıklama'],...c.expenses.map(x=>[x.date,nameOf(db.materials,x.materialId),tl(x.amount),x.note]),[],['ÖDEMELER'],['Ödeme tarihi','Kişi','Tutar (TL)','Borç dönemi','Açıklama'],...c.payments.map(x=>[x.date,nameOf(db.people,x.personId),tl(x.amount),x.period,x.note]),[],['Toplam harcama (TL)',tl(c.total)],['Toplanan (TL)',tl(c.paid)],['Kalan (TL)',tl(c.remaining)]];download('Pay-Defteri-'+period+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
const tl=n=>(n/100).toFixed(2).replace('.',',');
async function importFile(file){if(!file)return;try{if(file.size>10000000)throw Error('Yedek dosyası 10 MB sınırını aşıyor.');const incoming=validate(JSON.parse(await file.text()));if(!await ask('Yedek geri yüklensin mi?',`${incoming.people.length} kişi, ${incoming.materials.length} malzeme, ${incoming.expenses.length} harcama ve ${incoming.payments.length} ödeme yüklenecek.\nMevcut kayıtların tamamı bu yedekle değiştirilecek.`))return;if(lastRaw)download('Pay-Defteri-Aktarim-Oncesi-'+Date.now()+'.json',lastRaw,'application/json');commit(d=>{Object.keys(d).forEach(k=>delete d[k]);Object.assign(d,incoming);},{recover:true});toast('Yedek doğrulandı ve geri yüklendi.');}catch(e){fail(e);}finally{if($('#importFile'))$('#importFile').value='';}}
function bind(c){
 if($('#onlyOwing'))$('#onlyOwing').onchange=e=>{onlyOwing=e.target.checked;render();};
 if($('#selectAll'))$('#selectAll').onclick=()=>document.querySelectorAll('[name=member]').forEach(x=>{if(!db.people.find(p=>p.id===x.value).archived)x.checked=true;});
 if($('#membersForm'))$('#membersForm').onsubmit=async e=>{e.preventDefault();try{const checked=[...document.querySelectorAll('[name=member]:checked')].map(x=>x.value);const members=[...c.members.filter(x=>checked.includes(x)),...checked.filter(x=>!c.members.includes(x))];if(c.payments.some(x=>!members.includes(x.personId)))throw Error('Ödemesi bulunan kişi dönemden çıkarılamaz. Önce ilgili ödemeyi silin veya düzenleyin.');if(c.total&&JSON.stringify(members)!==JSON.stringify(c.members)&&!await ask('Dönem payları yeniden hesaplansın mı?',`${members.length} kişi seçildi. ${money(c.total)} toplam harcama seçilen kişiler arasında yeniden paylaştırılacak.`))return;commit(d=>d.periods[period]=members);toast('Dönem kişileri kaydedildi.');}catch(e){fail(e);}};
 if($('#registryForm'))$('#registryForm').onsubmit=e=>{e.preventDefault();try{const name=new FormData(e.target).get('name').trim();if(!name)throw Error('Bir ad girin.');if(db[active].some(x=>x.id!==editId&&x.name.toLocaleLowerCase('tr-TR')===name.toLocaleLowerCase('tr-TR')))throw Error('Bu ad zaten kayıtlı.');const old=editId;commit(d=>{if(old)d[active].find(x=>x.id===old).name=name;else d[active].push({id:id(),name,archived:false});});editId=null;render();toast('Kayıt kaydedildi.');}catch(e){fail(e);}};
 if($('#entryForm'))$('#entryForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),amount=cents(f.get('amount')),date=f.get('date'),entity=f.get('entity'),isExp=active==='expenses',kind=active,old=editId;if(!validDate(date))throw Error('Geçerli bir tarih girin.');if(!entity)throw Error('Lütfen bir kayıt seçin.');const target=isExp?periodOf(date):period;if(!validPeriod(target))throw Error('Bu tarih desteklenen dönem aralığının dışında.');if(isExp&&target!==period&&!await ask('Farklı döneme kaydedilsin mi?',`Bu alım ${target} dönemine ait. Kaydettikten sonra o dönem gösterilecek.`))return;const record={id:old||id(),date,amount,note:f.get('note').trim(),...(isExp?{materialId:entity}:{personId:entity,period})};commit(d=>{if(old)d[kind][d[kind].findIndex(x=>x.id===old)]=record;else d[kind].push(record);});editId=null;period=target;render();toast('Kayıt kaydedildi.');}catch(e){fail(e);}};
 if($('#cancelEdit'))$('#cancelEdit').onclick=()=>{editId=null;render();};
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();$('#view input')?.focus();});
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{active='payments';editId=null;render();$('[name=entity]').value=b.dataset.pay;$('[name=amount]').value=tl(c.rows.find(x=>x.id===b.dataset.pay).remaining);$('[name=amount]').focus();});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const kind=active,pid=b.dataset.delete;if(await ask('Kayıt silinsin mi?','Bu kayıt silinecek ve dönem toplamları yeniden hesaplanacak.'))try{commit(d=>d[kind]=d[kind].filter(x=>x.id!==pid));if(editId===pid){editId=null;render();}toast('Kayıt silindi.');}catch(e){fail(e);}});
 document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{try{commit(d=>{const x=d[active].find(x=>x.id===b.dataset.archive);x.archived=!x.archived;});toast('Kayıt güncellendi.');}catch(e){fail(e);}});
 if($('#exportJson'))$('#exportJson').onclick=()=>{try{exportJson();}catch(e){fail(e);}};
 if($('#exportCsv'))$('#exportCsv').onclick=()=>exportCsv(c);
 if($('#exportRaw'))$('#exportRaw').onclick=()=>download('Pay-Defteri-Ham-Veri.txt',lastRaw||'','text/plain');
 if($('#importFile'))$('#importFile').onchange=e=>importFile(e.target.files[0]);
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;editId=null;render();});
$('#period').onchange=e=>setPeriod(e.target.value);$('#prev').onclick=()=>setPeriod(movePeriod(period,-1));$('#next').onclick=()=>setPeriod(movePeriod(period,1));$('#today').onclick=()=>setPeriod(periodOf(today()));
window.addEventListener('storage',e=>{if(e.key===KEY){blocked=true;$('#fatal').hidden=false;$('#fatal').textContent='Kayıtlar başka bir sekmede değiştirildi. Güncel verilerle devam etmek için bu sayfayı yenileyin.';}});
render();
let installPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone())$('#installApp').hidden=true;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('#installApp').hidden=false;});
window.addEventListener('appinstalled',()=>{$('#installApp').hidden=true;installPrompt=null;toast('Pay Defteri yüklendi.');});
$('#installApp').onclick=async()=>{if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else{await ask('Telefona uygulama olarak yükleyin','Android’de bu siteyi Chrome ile açın. Tarayıcının ⋮ menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.\nYüklendikten ve çevrimdışı kullanım hazır olduktan sonra internetsiz açabilirsiniz. Kayıtlar bu cihazda kalır; cihazlar arasında taşımak için JSON yedeğini kullanın.');}try{await navigator.storage?.persist?.();}catch(e){}};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
 navigator.serviceWorker.register('./sw.js').then(async()=>{await navigator.serviceWorker.ready;$('#offlineReady').textContent=navigator.onLine?'Çevrimdışı kullanıma hazır · Veriler bu cihazda saklanır.':'Çevrimdışısınız · Kayıtlar cihazınıza kaydedilir.';}).catch(()=>{$('#offlineReady').textContent='Çevrimdışı hazırlık tamamlanamadı. İnternet bağlantısıyla sayfayı tekrar açın.';});
 window.addEventListener('offline',()=>{$('#offlineReady').textContent='Çevrimdışısınız · Kayıtlar cihazınıza kaydedilir.';});
 window.addEventListener('online',()=>{$('#offlineReady').textContent='Bağlantı açık · Veriler bu cihazda saklanır.';});
}
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_period_summary',description:'Seçilen dönemin harcamalarını, kişi paylarını ve eksik ödemelerini okur.',inputSchema:{type:'object',properties:{period:{type:'string',description:'YYYY-AA biçiminde dönem başlangıç ayı'}},required:['period'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||!validPeriod(input.period))throw Error('Geçerli dönem gerekli.');const c=calculate(db,input.period);return {period:input.period,totalCents:c.total,paidCents:c.paid,remainingCents:c.remaining,people:c.rows.map(x=>({...x,name:nameOf(db.people,x.id)}))};}})).catch(()=>{});}catch(e){}}
</script>
</body>
</html>
