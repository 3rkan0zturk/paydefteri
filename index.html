<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Defteri — Harcama ve Ödeme Takibi</title>
<meta name="description" content="Malzeme harcamalarını, kişi borç ve alacaklarını, ödemeleri ve kasayı takip edin. Çevrimdışı çalışır.">
<meta name="theme-color" content="#10213f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231649db'/%3E%3Cpath d='M9 8h14v17H9z' fill='white'/%3E%3Cpath d='M12 13h8m-8 5h8' stroke='%231649db' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header><div class="brand"><div class="mark" aria-hidden="true">▤</div><div><h1>Pay Defteri</h1><div class="sub">Malzeme, harcama ve ödeme takibi</div></div></div><button id="installApp" class="small">Telefona yükle</button></header>
<div id="offlineReady" class="muted" style="max-width:1240px;margin:10px auto 0;padding:0 24px" role="status">Veriler bu cihazda saklanır.</div>
<main><div id="fatal" class="error" role="alert" hidden></div><section class="periodbar"><div><div class="periodtitle" id="periodTitle"></div><div class="muted">Her dönem ayın 15’inde başlar, sonraki ayın 14’ü sonunda biter.</div></div><div class="periodcontrol"><button id="prev" aria-label="Önceki dönem">‹</button><input type="month" id="period" aria-label="Dönem başlangıç ayı" min="1900-01" max="9998-12"><button id="next" aria-label="Sonraki dönem">›</button><button id="today">Bu dönem</button></div></section>
<section class="stats" id="stats" aria-label="Dönem özeti"></section>
<nav role="tablist" aria-label="Bölümler"><button role="tab" data-tab="summary">Dönem özeti</button><button role="tab" data-tab="expenses">Harcamalar</button><button role="tab" data-tab="payments">Ödemeler</button><button role="tab" data-tab="cash">Kasa</button><button role="tab" data-tab="people">Kişiler</button><button role="tab" data-tab="materials">Malzemeler</button><button role="tab" data-tab="backup">Yedek ve aktarım</button></nav>
<div id="view" role="tabpanel"></div><dialog id="historyDialog"><h2>Hesap hareketleri</h2><div id="historyContent"></div><button id="closeHistory">Kapat</button></dialog><footer class="status" id="saveStatus"></footer><p class="muted">Veriler bu cihazın tarayıcısında saklanır. Cihazlar arasında otomatik eşitleme yoktur; düzenli JSON yedeği alın.</p></main>
<div id="toast" class="toast" role="status" hidden></div><dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="row" style="justify-content:flex-end"><button id="confirmNo">Vazgeç</button><button id="confirmYes" class="primary">Onayla</button></div></dialog>
<script src="./accounting.js"></script>
<script src="./storage.js"></script>
<script src="./app.js"></script>
</body>
</html>
